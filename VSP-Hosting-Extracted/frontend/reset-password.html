<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0868c9"><title>Reset password · VSP</title><style>
:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#172334;background:#f3f7fb}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border:1px solid #e1e8f0;border-radius:18px;padding:30px;box-shadow:0 20px 60px #1a3b5b17}.logo{width:60px;height:60px;object-fit:cover;border-radius:12px;background:#080b11}.eyebrow{margin:18px 0 5px;color:#0868c9;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:26px;margin:0 0 8px}p{color:#6e7b8d;font-size:13px;line-height:1.6}.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:12px;font-weight:750}.field input{height:44px;border:1px solid #dce3eb;border-radius:9px;padding:0 12px;font:inherit}.btn{width:100%;height:45px;border:0;border-radius:9px;background:#0868c9;color:#fff;font-weight:800;font-size:13px;cursor:pointer}.status{min-height:20px;font-size:12px;color:#a43232}.home{display:inline-block;margin-top:17px;color:#0868c9;font-size:12px;font-weight:700;text-decoration:none}
</style></head><body><main class="card"><img class="logo" src="/assets/vsp-logo.jpg" alt="VSP logo"><div class="eyebrow">VSP account security</div><h1>Choose a new password</h1><p>Reset links expire after 30 minutes and can only be used once.</p><form id="resetForm"><div class="field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div><div class="status" id="status" role="status"></div><button class="btn">Update password</button></form><a class="home" href="/">← Return to VSP</a></main><script>
const token=new URLSearchParams(location.search).get('token'),form=document.querySelector('#resetForm'),status=document.querySelector('#status');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='';const password=form.password.value;if(password!==document.querySelector('#confirm').value){status.textContent='Passwords do not match.';return}if(!token){status.textContent='Reset link is missing. Request a fresh link from the sign-in window.';return}try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Could not update password.');status.style.color='#17663f';status.textContent=d.message;form.querySelector('button').disabled=true}catch(err){status.textContent=err.message}});
</script></body></html>
